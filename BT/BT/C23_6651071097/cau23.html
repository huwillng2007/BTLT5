<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câu 23 - Tính lương tháng</title>
<link rel="stylesheet" href="Styles/cau23.css">
<script src="Scripts/cau23.js" defer></script>
</head>
<body>
  <form id="salaryForm" onsubmit="return false;">
    <table class="salary">
      <tr>
        <td class="label">Lương</td>
        <td><input type="text" id="luong" value="1000000"></td>
      </tr>
      <tr>
        <td class="label">Hệ số lương</td>
        <td>
          <select id="heso">
            <option value="1.0">1.0</option>
            <option value="1.5">1.5</option>
            <option value="2.0">2.0</option>
            <option value="2.5">2.5</option>
            <option value="3.0">3.0</option>
            <option value="3.2" selected>3.2</option>
            <option value="3.5">3.5</option>
            <option value="4.0">4.0</option>
          </select>
        </td>
      </tr>
      <tr>
        <td colspan="2" class="center">
          <input type="button" id="btnTinh" value="Tính lương tháng">
        </td>
      </tr>
      <tr>
        <td class="label">Lương tháng</td>
        <td id="luongThang" class="out"></td>
      </tr>
    </table>
  </form>
</body>
</html>
