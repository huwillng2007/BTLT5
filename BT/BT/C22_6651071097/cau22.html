<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câu 22 - Nhân / Chia hai số</title>
<link rel="stylesheet" href="Styles/cau22.css">
<script src="Scripts/cau22.js" defer></script>
</head>
<body>
  <form id="calcForm" class="box" onsubmit="return false;">
    <div class="row">
      <label for="num1">1st Number :</label>
      <input type="text" id="num1" name="num1">
    </div>
    <div class="row">
      <label for="num2">2nd Number:</label>
      <input type="text" id="num2" name="num2">
    </div>
    <div class="buttons">
      <button type="button" id="btnMultiply">Multiply</button>
      <button type="button" id="btnDivide">Divide</button>
    </div>
    <p class="result-label">The Result Is :</p>
    <p id="result" class="result"></p>
  </form>
</body>
</html>
