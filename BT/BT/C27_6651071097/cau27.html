<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câu 27 - Xóa dòng trong bảng</title>
<link rel="stylesheet" href="Styles/cau27.css">
<script src="Scripts/cau27.js" defer></script>
</head>
<body>
  <table id="bang" class="grid">
    <thead>
      <tr>
        <th>Số lượng</th>
        <th>Đơn giá</th>
        <th>Tổng</th>
        <th>Chức năng</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" class="sl" value="2"></td>
        <td><input type="text" class="dg" value="1000000"></td>
        <td><input type="text" class="tong" value="2000000" readonly></td>
        <td><input type="button" class="btn-xoa" value="Xóa"></td>
      </tr>
      <tr>
        <td><input type="text" class="sl" value="1"></td>
        <td><input type="text" class="dg" value="500000"></td>
        <td><input type="text" class="tong" value="500000" readonly></td>
        <td><input type="button" class="btn-xoa" value="Xóa"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
